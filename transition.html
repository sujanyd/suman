<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        .box{
            width: 100px;
            height: 100px;
            background-color: blue;
            color: white;
            
            transition:all 2s ease-in-out ;
            
        }
        .box:hover{
            width: 300px;
            height: 300px;
            background-color: green;
            border-radius: 50%;
            
        }
    </style>
</head>
<body>
    <div class="box">
        Sujan
    </div>
</body>
</html>
