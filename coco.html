<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        body{
            background-color: black;
        }
        .container{
            width:1000px;
            height:800px;
            background-color: black;
            border: 10px solid white; 
            
            border-radius: 50px;  
            overflow: hidden;
            margin-left:25%;
            margin-top: 100px;
            }
            .box{
                width:400px;
                height: 400px;
                border:2px solid black;
                  box-shadow: 0px 0px 100px red; 
                background-color: black;
                border-radius: 50%; 
                position:relative;
                top:200px;
                left:300px;
                transition: all;
                transition-delay: 2s;
            }
            h3{
                font-family:Georgia, 'Times New Roman', Times, serif;
                color:rgb(148, 48, 48);
                font-size: 70px;
                position: relative;
                top: 150px;
                left: 30px;
                transform: rotateZ(-20deg);
                
            }
            .box:hover{
                transform:scale3d(1.25, 1.25,1.25);
            }
            
    </style>
<body>
    <div class="container">
        <div class="box">
            <h3>Coca'Coca</h3>
        </div>
    </div>
    
</body>
</html>
