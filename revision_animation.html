<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: red;
            position: relative;
            animation: moveBox 4s ease-in-out infinite 1s alternate forwards;
        }
        @keyframes moveBox{
            0%{
                left: 0px;
                background-color: red;
            }
            50%{
                left: 200px;
                background-color: yellow;
            }
            100%{
                left: 400px;
                background-color: green;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
    
</body>
</html>
