<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
     .container {    /* grid container */ 
      
     display:grid;
     background-color: rgb(241, 244, 245);
     /* grid-template-columns:  repeat(5,minmax(auto,50px)); */
     grid-template-columns: 50px 50px 50px;
     grid-template-rows: 50px 50px 50px;
     /* row-gap: 10px; */
     /* grid-gap:20px; */
     
    }
    .container div{
      border: 1px solid rgb(6, 6, 6);
      color:rgb(5, 3, 3);
      font-size: 1em;
      text-align:center;
    }
    /* .div1,.div3,.div5{grid-column: 1/span 2;} */
    .div1{
        grid-column: 1/4;
        grid-row:1/3;

    }

  </style>
</head>

<body style="margin: 0px;padding: 0px">
  <div class="container">

    <div class="div1">v</div>
    <div class="div2">i</div>
    <div class="div3">v</div>
    <div class="div4">a</div>
    <div class="div5">a</div>
    <div class="div6">n</div>

  </div>
</body>

</html>
