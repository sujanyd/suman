    <title>Document</title>
    <style>
        .continer{
            width: 800px;
            height: 800px;
            background-color: blanchedalmond;
            margin-left: 30%;
            border-radius: 50%;

        }
        .box{
            width: 700px;
            height:700px;
            background-color: red;
            position: relative;
            border-radius: 50%;
            top:50px;
            left:50px;
            animation: move 1s linear infinite;
            
        }
        .box1{
            width: 500px;
            height:500px;
            background-color: rgb(249, 249, 250);
            position: relative;
            border-radius: 50%;
            top:100px;
            left:100px
        }
        img{
            position: relative;
            top: 30px;
            left:30px
        }
        @keyframes move{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }
        .box2{
            width: 300px;
            height: 300px;
            background-color: black;
            border-radius: 50%;
            position: relative;
            top: 100px;
            left:100px;
        }
        .circle{
            width: 50px;
            height: 50px;
            background-color: bisque;
            margin-left: 48%;
            border-radius: 50%;
        }

    </style>
