<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0px;
            padding: 0px;
        }
        
        .box{
            
            width:200px;
            height: 200px;
            background: linear-gradient(rgb(139, 91, 91) , rgb(75, 200, 138));
            position: relative;
            animation: move 5s linear infinite alternate;
        }
        @keyframes move{
            0%{
                transform: rotate(0deg);
                left:0px;
            }
            25%{
                transform: rotate(45deg);
                left:200px;
            }
            50%{
                transform: rotate(90deg);
                left:400px;
            }
            75%{
                transform: rotate(135deg);
                left:600px;
            }
            100%{
                transform: rotate(180deg);
                left:800px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
