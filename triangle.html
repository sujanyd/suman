<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 0;
            height:0;
            border-left:800px solid transparent;
            border-right: 800px solid transparent; 
            border-bottom: 800px solid black;
            
        }
        .box1{
            position: absolute;
            top: 410px;
            left:410px;
            width: 0;
            height:0;
            border-left:398px solid transparent;
            border-right: 398px solid transparent; 
            border-top: 398px solid rgb(236, 34, 34);
        }
        .box2{
            position: relative;
            top: -400px;
            left:-200px;
            width: 0;
            height:0;
            border-left:198px solid transparent;
            border-right: 198px solid transparent; 
            border-bottom: 198px solid rgb(150, 99, 99);

        }
        .circle{
            
            width: 150px;
            height:150px;
            background-color: bisque;
            border: 5px dashed black;
            border-radius: 50%;
            position: relative;
            top: 40px;
            left:-80px;
            animation: spin 5s linear infinite;
        }
        @keyframes spin{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="box1">
            <div class="box2">
                <div class="circle"></div>
            </div>

        </div>

    </div>
    
</body>
</html>
